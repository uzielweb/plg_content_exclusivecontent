PLG_CONTENT_EXCLUSIVECONTENT="Content - Exclusive Content"
PLG_CONTENT_EXCLUSIVECONTENT_XML_DESCRIPTION="<p><strong>Exclusive Content</strong> restricts entire articles or specific text parts strictly to logged-in users or specific VIP groups.</p><hr /><p><strong>HOW IT WORKS:</strong></p><p><strong>1. Restricting parts of text (Shortcode)</strong><br />Wrap the text you want to restrict between <code>{exclusive}</code> and <code>{/exclusive}</code>. The hidden content will be replaced by a login form.</p><p><strong>2. Restricting the entire article</strong><br />When creating or editing a Joomla article, open the <em>Options</em> tab and find the <em>'Exclusive Content'</em> field. Turning it on will automatically lock the article right after the Intro Text (Read more separator), and the rest of the text will not be sent to the visitor.</p><hr /><p><strong>Security:</strong> The restricted content is 100% hidden from the source code for unauthorized users.</p>"

