PLG_CONTENT_EXCLUSIVECONTENT="Conteúdo - Conteúdo Exclusivo"
PLG_CONTENT_EXCLUSIVECONTENT_XML_DESCRIPTION="<p><strong>Conteúdo Exclusivo</strong> permite restringir artigos inteiros ou partes específicas de qualquer texto apenas para usuários logados ou grupos VIPs.</p><hr /><p><strong>COMO FUNCIONA:</strong></p><p><strong>1. Restrição de partes de um texto (Shortcode)</strong><br />Digite a tag <code>{exclusive}</code> antes do parágrafo que deseja esconder, e <code>{/exclusive}</code> no final. O conteúdo bloqueado será substituído pelo formulário de login.</p><p><strong>2. Restrição do Artigo Inteiro</strong><br />Quando estiver criando/editando um artigo do Joomla, acesse a aba lateral <em>Opções</em> e procure o campo <em>'Conteúdo Exclusivo'</em>. Ao ativá-lo, o artigo será bloqueado automaticamente a partir do texto de introdução (Leia mais) e todo o resto não será enviado para o visitante.</p><hr /><p><strong>Segurança:</strong> O conteúdo fica 100% oculto no código-fonte para usuários não autorizados.</p>"